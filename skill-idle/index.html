<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky stats bar, 3D isometric classroom stage, skill picker, tabbed management panels */
:root{color-scheme:dark;--bg:#141a33;--bg2:#1c2447;--card:#232d58;--card2:#2b376a;--line:#3a4784;--text:#f3f1ff;--muted:#aab2dc;
  --accent:#8b6cff;--accent2:#6a4de0;--good:#38d39f;--good2:#20a47a;--gold:#ffc94d;--bad:#ff6b85;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a3570 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:600 15px/1.4 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(180deg,var(--bg2),#18203f);border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;box-shadow:0 6px 20px #0006}
header h1{font:700 21px var(--display);margin:0 auto 0 0;letter-spacing:.3px;background:linear-gradient(180deg,#fff,#cfc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2e3a73,#232c5a);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 5px;box-shadow:inset 0 1px 0 #ffffff1a}
.pill .e{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff6,#0000 60%),var(--c,#ffc94d);font-size:14px}
.pill b{font:600 17px var(--display);font-variant-numeric:tabular-nums}.pill small{color:var(--muted);font-size:11px}
.wrap{max-width:1040px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
#stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid #4a58a0;box-shadow:0 18px 40px #0008,inset 0 0 0 1px #ffffff14;background:#1a2140}
#room{display:block;width:100%;touch-action:none;cursor:pointer}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font:700 18px var(--display);white-space:nowrap;text-shadow:0 2px 0 #0009,0 0 8px #0006;color:#fff}
#hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#hud span{background:#0d1230b3;border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:#e7e9ff;backdrop-filter:blur(4px)}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 10px}
#tool{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;padding:8px 10px 7px;border-radius:16px;
  background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid var(--line);box-shadow:0 4px 0 #11173a,inset 0 1px 0 #ffffff22}
.chip .i{font-size:26px;line-height:1.1;filter:drop-shadow(0 2px 2px #0007)}.chip .n{font:600 14px var(--display)}.chip small{color:var(--muted);font-size:11px}
.chip.on{border-color:var(--gold);background:linear-gradient(180deg,#4a3f8f,#342b70);box-shadow:0 4px 0 #1b1442,0 0 0 3px #ffc94d33}
.chip.poor small{color:var(--bad)}
button{font:700 14px var(--body);color:var(--text);background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;
  box-shadow:0 3px 0 #11173a,inset 0 1px 0 #ffffff1f;transition:transform .06s}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #11173a}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:linear-gradient(180deg,#a088ff,var(--accent2));border-color:#b6a3ff;box-shadow:0 3px 0 #3d2a99,inset 0 1px 0 #ffffff55}
button.go{background:linear-gradient(180deg,#5cf0bb,var(--good2));border-color:#7ff5c9;color:#05301f;box-shadow:0 3px 0 #0f6b4c,inset 0 1px 0 #ffffff66}
button:disabled{filter:grayscale(.7);opacity:.45;cursor:not-allowed}
nav{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
nav button{font:600 15px var(--display);border-radius:14px}
nav button.on{background:linear-gradient(180deg,#ffd877,#f0a92c);color:#3a2300;border-color:#ffe39c;box-shadow:0 3px 0 #9b6410,inset 0 1px 0 #fff8}
.badge{font:700 11px var(--body);padding:1px 7px;border-radius:999px;background:var(--bad);color:#fff;margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 6px 16px #0005,inset 0 1px 0 #ffffff14}
.item{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item .grow{flex:1;min-width:160px}
.orb{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 30% 25%,#ffffff55,#0000 55%),var(--c,#6a4de0);box-shadow:inset 0 -4px 0 #0003,0 3px 8px #0006}
.name{font:600 17px var(--display)}
.muted{color:var(--muted);font-size:13px;font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.bar{height:10px;background:#141a3a;border-radius:6px;overflow:hidden;margin:5px 0;box-shadow:inset 0 1px 2px #0008}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(180deg,#ffe08a,#f0a92c)}
.tier{margin-bottom:16px}
.tier h3{margin:0 0 8px;font:600 14px var(--display);color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.node{display:flex;flex-direction:column;gap:5px}
.node.lock{opacity:.55}
.pips{display:flex;gap:3px;flex-wrap:wrap}.pips i{width:12px;height:12px;border-radius:50%;background:#141a3a;box-shadow:inset 0 1px 2px #0008}.pips i.f{background:radial-gradient(circle at 35% 30%,#fff8,#0000 60%),var(--gold);box-shadow:0 0 6px #ffc94d88}
.locked .orb,.locked .grow{opacity:.55}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:10;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:linear-gradient(180deg,#3a3277,#2a2560);border:1px solid #8b6cff;border-radius:14px;padding:9px 14px;box-shadow:0 8px 20px #0008;animation:f 4s forwards}
@keyframes f{0%{opacity:0;transform:translateY(8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
.big{font:700 30px var(--display)}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:4s}button{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Skill Academy</h1>
  <span class="pill"><span class="e">🪙</span><b id="coins">0</b></span>
  <span class="pill" style="--c:#7ad7ff"><span class="e">📦</span><b id="invv">0</b><small>stock</small></span>
  <span class="pill" style="--c:#c9a7ff"><span class="e">🦉</span><b id="wis">0</b></span>
</header>
<div class="wrap">
  <div id="stage"><canvas id="room"></canvas><div id="fx"></div><div id="hud"></div></div>
  <div class="hint">Tap an empty chair to enroll · tap a student to tutor them · swipe across glowing students to harvest skill points (long swipes = combo bonus).</div>
  <div id="tool"></div>
  <nav id="tabs">
    <button data-tab="market" class="on">Market</button>
    <button data-tab="contracts">Contracts <span id="cbadge" class="badge" hidden></span></button>
    <button data-tab="adv">Advancement</button>
    <button data-tab="skills">Skills</button>
    <button data-tab="mastery">Graduation</button>
  </nav>
  <section id="market" class="list"></section>
  <section id="contracts" class="list" hidden></section>
  <section id="adv" hidden></section>
  <section id="skills" class="list" hidden></section>
  <section id="mastery" hidden></section>
</div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
// ================= data =================
const SKILLS=[
  {id:'juggle',name:'Juggling',icon:'🤹',color:'#ff8a5c',unlock:0,grow:6,enroll:1,price:3},
  {id:'cook',name:'Cooking',icon:'🍳',color:'#ffc23d',unlock:150,grow:15,enroll:10,price:30},
  {id:'fit',name:'Fitness',icon:'💪',color:'#ef476f',unlock:2500,grow:35,enroll:120,price:350},
  {id:'draw',name:'Painting',icon:'🎨',color:'#2ec4a6',unlock:4e4,grow:80,enroll:1500,price:4500},
  {id:'music',name:'Guitar',icon:'🎸',color:'#4cc9f0',unlock:6e5,grow:180,enroll:2e4,price:6e4},
  {id:'code',name:'Coding',icon:'💻',color:'#9d7bff',unlock:1e7,grow:400,enroll:3e5,price:8e5},
  {id:'lang',name:'Languages',icon:'🗣️',color:'#f78c6b',unlock:2e8,grow:900,enroll:5e6,price:1.2e7},
  {id:'chess',name:'Chess',icon:'♟️',color:'#b8a9ff',unlock:4e9,grow:2000,enroll:8e7,price:2e8},
];
const ADV=[
  {id:'tables',tier:0,name:'Training Tables',icon:'🪑',desc:'+1 table — the room grows',max:8,base:50,g:4.5},
  {id:'seats',tier:0,name:'Longer Tables',icon:'📏',desc:'+1 chair on every table',max:4,base:150,g:9},
  {id:'lamps',tier:1,name:'Study Lamps',icon:'💡',desc:'+20% student growth speed',max:15,base:200,g:2.6,req:['tables',1]},
  {id:'mkt',tier:1,name:'Marketing',icon:'📣',desc:'+15% market sell price',max:20,base:300,g:2.4,req:['tables',1]},
  {id:'scholar',tier:1,name:'Scholarships',icon:'🎓',desc:'−15% enrollment cost',max:5,base:500,g:3.5,req:['seats',1]},
  {id:'tutor',tier:2,name:'Tutors',icon:'🧑‍🏫',desc:'A tutor walks the room and harvests ready students',max:5,base:1500,g:5,req:['lamps',2]},
  {id:'gifted',tier:2,name:'Gifted Program',icon:'⭐',desc:'+1 skill point per harvest',max:10,base:8000,g:6,req:['scholar',2]},
  {id:'office',tier:3,name:'Front Desk',icon:'🛎️',desc:'Re-enrolls the same skill after each harvest',max:1,base:6000,g:1,req:['tutor',1]},
  {id:'agent',tier:3,name:'Talent Agent',icon:'💼',desc:'Auto-sells your stock (smaller fee per level)',max:5,base:25000,g:6,req:['office',1]},
];
const TIERS=['Tier I · Facilities','Tier II · Quality','Tier III · Staff','Tier IV · Automation'];
const TUTOR_IV=[8,4,2,1,.5];
const RANKS=[[0,'Novice'],[10,'Apprentice'],[25,'Adept'],[50,'Expert'],[100,'Master'],[200,'Grandmaster']];
const D=Object.fromEntries(SKILLS.map(s=>[s.id,s])),A=Object.fromEntries(ADV.map(a=>[a.id,a]));
const KEY='skillacademy-v1',OFFLINE_CAP=8*3600;

function fresh(k={}){
  return {coins:15,runEarned:0,lifetime:k.lifetime||0,wisdom:k.wisdom||0,prestiges:k.prestiges||0,sel:'juggle',
    tables:[],skills:Object.fromEntries(SKILLS.map((d,i)=>[d.id,{u:i===0,lv:0,xp:0}])),
    inv:Object.fromEntries(SKILLS.map(d=>[d.id,0])),dem:Object.fromEntries(SKILLS.map(d=>[d.id,1])),
    trend:Object.fromEntries(SKILLS.map(d=>[d.id,0])),
    adv:Object.fromEntries(ADV.map(a=>[a.id,0])),contracts:[],nextC:Date.now()+20e3,tt:0,at:0,mt:0,last:Date.now()};
}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const f=fresh();
  for(const k of['skills','inv','dem','trend','adv'])r[k]={...f[k],...r[k]};return{...f,...r}}}catch(e){}return fresh()}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function syncSeats(){const T=1+S.adv.tables,N=2+S.adv.seats;
  while(S.tables.length<T)S.tables.push([]);for(const t of S.tables)while(t.length<N)t.push({s:null,p:0})}
syncSeats();

// ================= formulas =================
const lvMult=id=>{const lv=S.skills[id].lv;return(1+.08*lv)*2**Math.floor(lv/25)};
const growTime=id=>D[id].grow/((1+.2*S.adv.lamps)*(1+.02*S.skills[id].lv));
const enrollCost=id=>D[id].enroll*(1-.15*S.adv.scholar);
const yieldOf=id=>1+Math.floor(S.skills[id].lv/5)+S.adv.gifted;
const basePrice=id=>D[id].price*lvMult(id)*(1+.15*S.adv.mkt)*(1+.05*S.wisdom);
const price=id=>basePrice(id)*S.dem[id];
const xpNeed=lv=>Math.ceil(5+4*lv**1.4);
const rank=lv=>RANKS.filter(r=>lv>=r[0]).pop()[1];
const advCost=a=>Math.ceil(a.base*a.g**S.adv[a.id]);
const advOpen=a=>!a.req||S.adv[a.req[0]]>=a.req[1];
const agentFee=()=>.65+.07*S.adv.agent;
const invValue=()=>SKILLS.reduce((t,d)=>t+S.inv[d.id]*price(d.id),0);
const wisdomTotal=()=>Math.floor(Math.sqrt(S.lifetime/1e5));
const wisdomGain=()=>Math.max(0,wisdomTotal()-S.wisdom);

// ================= simulation =================
let quiet=false;
function earn(n){S.coins+=n;S.runEarned+=n;S.lifetime+=n}
function gainXP(id,n){const st=S.skills[id],b=st.lv;st.xp+=n;
  while(st.xp>=xpNeed(st.lv)){st.xp-=xpNeed(st.lv);st.lv++}
  if(st.lv>b&&!quiet){
    if(rank(st.lv)!==rank(b))toast(`${D[id].icon} ${D[id].name} reached rank ${rank(st.lv)}!`);
    else if(Math.floor(st.lv/25)>Math.floor(b/25))toast(`${D[id].icon} ${D[id].name} Lv ${st.lv}: value ×2!`);
    else if(Math.floor(st.lv/5)>Math.floor(b/5))toast(`${D[id].icon} ${D[id].name} Lv ${st.lv}: +1 point per harvest`);
    dirty.skills=1}}
function harvest(t,j,combo=1){
  const seat=S.tables[t][j],id=seat.s,n=yieldOf(id)*Math.min(2,1+.1*(combo-1));
  S.inv[id]+=n;gainXP(id,n);
  if(!quiet){floatAt(t,j,`+${fmt(n)} ${D[id].icon}`,D[id].color);burst(t,j,D[id].color)}
  const c=enrollCost(id);
  if(S.adv.office&&S.coins>=c){S.coins-=c;seat.p=0}else{seat.s=null;seat.p=0}
}
function sell(id,n,fee=1){n=Math.min(n,S.inv[id]);if(n<=0)return 0;
  const v=n*price(id)*fee;S.inv[id]-=n;earn(v);S.dem[id]=Math.max(.5,S.dem[id]-.02);return v}
function step(dt){
  for(const t of S.tables)for(const seat of t)if(seat.s&&seat.p<1)seat.p=Math.min(1,seat.p+dt/growTime(seat.s));
  if(S.adv.tutor){S.tt+=dt;const iv=TUTOR_IV[S.adv.tutor-1];
    if(S.tt>=iv){S.tt=0;S.tables.forEach((t,ti)=>t.forEach((seat,si)=>{if(seat.s&&seat.p>=1)harvest(ti,si)}))}}
  if(S.adv.agent){S.at+=dt;if(S.at>=3){S.at=0;let v=0;for(const d of SKILLS)if(S.inv[d.id]>0)v+=sell(d.id,S.inv[d.id],agentFee());if(v&&!quiet)floatScreen(`💼 +🪙 ${fmt(v)}`,'#7ff5c9')}}
  S.mt+=dt;if(S.mt>=4){S.mt=0;for(const d of SKILLS){const o=S.dem[d.id];
    S.dem[d.id]=Math.min(1.6,Math.max(.5,o+(1-o)*.1+(Math.random()-.5)*.12));S.trend[d.id]=S.dem[d.id]-o}}
  if(!quiet)contractsTick();
}
function advance(sec){
  if(sec<=2){step(sec);return}
  sec=Math.min(sec,OFFLINE_CAP);const c0=S.coins;quiet=true;
  const n=Math.ceil(sec);for(let i=0;i<n;i++)step(sec/n);quiet=false;
  if(sec>30)toast(`Away ${fmtT(sec)} — earned 🪙 ${fmt(Math.max(0,S.coins-c0))}, stock worth 🪙 ${fmt(invValue())}`);
  renderAll();
}

// ================= contracts =================
const CLIENTS=['Local café','Summer camp','Startup','Talent show','Gym chain','Film studio','Museum','Tech giant','Embassy','World tour'];
function contractsTick(){
  const now=Date.now(),before=S.contracts.length;
  S.contracts=S.contracts.filter(c=>c.exp>now);
  if(now>=S.nextC){S.nextC=now+30e3+Math.random()*30e3;
    const un=SKILLS.filter(d=>S.skills[d.id].u);
    if(S.contracts.length<3){const d=un[Math.floor(Math.random()*un.length)];
      const qty=Math.ceil((5+Math.random()*20)*yieldOf(d.id));
      S.contracts.push({id:d.id,qty,reward:Math.ceil(qty*basePrice(d.id)*(2+Math.random())),exp:now+180e3,
        who:CLIENTS[Math.min(CLIENTS.length-1,SKILLS.indexOf(d)+Math.floor(Math.random()*3))]});
      toast(`📜 New contract: ${qty} ${d.icon} ${d.name}`)}}
  if(S.contracts.length!==before)dirty.contracts=1;
}

// ================= actions =================
const act={
  select(id){S.sel=id;renderTool()},
  unlock(id){const c=D[id].unlock;if(S.coins>=c&&!S.skills[id].u){S.coins-=c;S.skills[id].u=true;S.sel=id;toast(`Unlocked ${D[id].icon} ${D[id].name}!`);renderAll()}},
  adv(id){const a=A[id],c=advCost(a);if(advOpen(a)&&S.adv[id]<a.max&&S.coins>=c){S.coins-=c;S.adv[id]++;syncSeats();renderAll()}},
  sell(id,all){const v=sell(id,all?S.inv[id]:Math.min(S.inv[id],Math.max(1,yieldOf(id))));if(v)floatScreen(`+🪙 ${fmt(v)}`)},
  sellAll(){let v=0;for(const d of SKILLS)v+=sell(d.id,S.inv[d.id]);if(v){floatScreen(`+🪙 ${fmt(v)}`);toast(`Sold everything for 🪙 ${fmt(v)}`)}},
  fulfill(i){const c=S.contracts[i];if(c&&S.inv[c.id]>=c.qty){S.inv[c.id]-=c.qty;earn(c.reward);S.contracts.splice(i,1);
    toast(`✅ ${c.who} paid 🪙 ${fmt(c.reward)}`);renderContracts()}},
  prestige(e){const g=wisdomGain();if(g<1)return;
    if(!armed(e,`Tap again: reset run for +${g} 🦉`))return;
    S=fresh({lifetime:S.lifetime,wisdom:S.wisdom+g,prestiges:S.prestiges+1});syncSeats();save();toast(`🦉 +${g} Wisdom`);renderAll()},
  hardReset(e){if(armed(e,'Tap again to delete ALL progress')){S=fresh();syncSeats();save();renderAll()}},
};

// ================= 3D classroom =================
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('room'),fxLayer=$('fx');
const has3D=typeof THREE!=='undefined';
let renderer,scene,cam,sun,roomGroup,views=[],hits=[],staff={},sig='',bounds={},clock=0;
const ray=has3D?new THREE.Raycaster():null,v3=has3D?new THREE.Vector3():null;

function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
const std=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.55,metalness:0,...o});
function mk(geo,mat,p=[0,0,0],r=[0,0,0],cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(...p);m.rotation.set(...r);m.castShadow=cast;m.receiveShadow=true;return m}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

let G,MT,TX;
function init3D(){
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();scene.background=new THREE.Color('#1a2140');
  cam=new THREE.OrthographicCamera(-5,5,5,-5,.1,300);
  scene.add(new THREE.HemisphereLight('#fff1dc','#5a4636',.5));
  sun=new THREE.DirectionalLight('#ffe3bd',1.25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
  scene.add(sun,sun.target);
  const fill=new THREE.DirectionalLight('#a9c8ff',.4);fill.position.set(-12,7,6);scene.add(fill);
  roomGroup=new THREE.Group();scene.add(roomGroup);

  G={body:new THREE.CapsuleGeometry(.2,.26,6,16),head:new THREE.SphereGeometry(.26,28,20),
    hair:new THREE.SphereGeometry(.275,28,16,0,Math.PI*2,0,Math.PI*.52),bun:new THREE.SphereGeometry(.12,16,12),

      live('skills',h('div',{class:'bar'},fill),()=>fill.style.width=Math.min(100,st.xp/xpNeed(st.lv)*100)+'%'),
      live('skills',h('div',{class:'muted'}),e=>e.textContent=
        `${fmt(yieldOf(d.id))} pts per harvest · trains in ${fmtT(growTime(d.id))} · value ×${lvMult(d.id).toFixed(2)} · next ×2 at Lv ${(Math.floor(st.lv/25)+1)*25}`))))})}

function renderMastery(){const box=$('mastery');box.replaceChildren();U.mastery=[];
  box.append(h('div',{class:'card'},h('div',{class:'item'},h('span',{class:'orb',style:'--c:#9d7bff'},'🦉'),h('div',{class:'grow'},h('div',{class:'name'},'Graduation'),
      h('div',{class:'muted'},'Graduate your class and start over wiser. Each Wisdom adds +5% to every sale price, forever.'))),
      h('p',{},`Wisdom: ${S.wisdom} → +${S.wisdom*5}% prices`),
      live('mastery',h('div',{class:'big'}),e=>e.textContent=`+${wisdomGain()} 🦉 available`),
      live('mastery',h('div',{class:'muted'}),e=>{const t=wisdomTotal()+1;e.textContent=`Next Wisdom at 🪙 ${fmt(t*t*1e5)} lifetime earnings (now ${fmt(S.lifetime)})`}),
      h('p',{},live('mastery',h('button',{class:'primary',onclick:act.prestige},'Graduate & reset'),e=>e.disabled=wisdomGain()<1))),
    h('div',{class:'card',style:'margin-top:10px'},h('div',{class:'name'},'Stats'),
      live('mastery',h('div',{class:'muted'}),e=>e.textContent=`This run: 🪙 ${fmt(S.runEarned)} · Graduations: ${S.prestiges}`),
      h('p',{},h('button',{onclick:act.hardReset},'Hard reset'))))}

const RP={market:renderMarket,contracts:renderContracts,adv:renderAdv,skills:renderSkills,mastery:renderMastery};
function renderAll(){renderTool();for(const k in RP)RP[k]()}
function renderHud(){const el=$('hud'),bits=[];
  if(S.adv.tutor)bits.push(`🧑‍🏫 harvests every ${fmtT(TUTOR_IV[S.adv.tutor-1])}`);if(S.adv.office)bits.push('🛎️ auto re-enroll');if(S.adv.agent)bits.push(`💼 selling at ${Math.round(agentFee()*100)}%`);
  const ready=S.tables.flat().filter(s=>s.s&&s.p>=1).length;if(ready)bits.push(`✨ ${ready} ready`);
  const k=bits.join('|');if(el.dataset.k!==k){el.dataset.k=k;el.replaceChildren(...bits.map(b=>h('span',{},b)))}}
function update(){
  $('coins').textContent=fmt(S.coins);$('invv').textContent=fmt(invValue());$('wis').textContent=S.wisdom;
  const cb=$('cbadge');cb.hidden=!S.contracts.length;cb.textContent=S.contracts.length;
  if(dirty.contracts)renderContracts();if(dirty.skills)renderSkills();renderHud();
  U.tool.forEach(f=>f());for(const k in RP)if(!$(k).hidden)U[k].forEach(f=>f());
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.tab;
  for(const x of $('tabs').children)x.classList.toggle('on',x===b);for(const k in RP)$(k).hidden=k!==t;RP[t]()});

// ================= utils =================
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(n<1000)return n<100&&n%1?(+n.toFixed(1)).toString():String(Math.floor(n));
  const e=Math.floor(Math.log10(n)/3);if(e>=SUF.length)return n.toExponential(2);return(n/1000**e).toFixed(2).replace(/\.?0+$/,'')+SUF[e]}
function fmtT(s){if(s<60)return(s<10?(+s.toFixed(1)):Math.round(s))+'s';if(s<3600)return`${Math.floor(s/60)}m ${Math.floor(s%60)}s`;return`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`}
function armed(e,msg){const b=e.currentTarget;if(b.dataset.armed)return true;b.dataset.armed=1;const t=b.textContent;b.textContent=msg;
  setTimeout(()=>{delete b.dataset.armed;b.textContent=t},4000);return false}
function toast(m){const box=$('toasts');while(box.children.length>=3)box.firstChild.remove();const t=h('div',{class:'toast'},m);box.append(t);setTimeout(()=>t.remove(),4000)}

// ================= boot =================
if(has3D){try{init3D()}catch(e){console.error(e);renderer=null}}
if(!renderer)stage.replaceChildren(h('div',{class:'card',style:'margin:0;border-radius:0'},'The 3D classroom could not load (WebGL or the Three.js library is unavailable). Reload the page to try again.'));
renderAll();advance((Date.now()-S.last)/1000);S.last=Date.now();
let uiT=0;
function loop(){const now=Date.now(),dt=(now-S.last)/1000;S.last=now;advance(dt);const fd=Math.min(dt,.1);render3D(fd);if(renderer)updateParts(fd);
  uiT+=dt;if(uiT>.15){uiT=0;update()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(save,5000);addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeunload',save);
</script>
</body>
</html>
